# Cloudflare Pages configuration (config-as-code).
# When this file is present, it is the source of truth for the bindings/vars
# below — the Dashboard equivalents for these environments become read-only.
# Keep all required bindings here, or deployed Functions will lose access to them.
#
# Secrets are NOT stored here. Set them with `wrangler pages secret put <NAME>`
# or in the Dashboard (Settings -> Functions -> Environment variables).

name = "auto-airbds"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-25"

# The Google Sheet import route (functions/api/import-sheet.ts) bundles
# @airbds/converter-tools, whose csv-parse dependency uses Node's Buffer/stream.
# nodejs_compat provides those APIs in the Functions runtime.
compatibility_flags = ["nodejs_compat"]

# Strongly-consistent SQLite store read by the API functions as `context.env.DB`
# (see functions/api/upload.ts, functions/api/entries.ts and entries/[id].ts).
# Strong consistency means uploads are visible to readers immediately, unlike KV.
[[d1_databases]]
binding = "DB"
database_name = "auto-airbds"
database_id = "edaec72b-969f-4f90-9d7d-13c7168b517f"

# Cloudflare Access — admin authentication (see functions/auth.ts and the
# "Admin area" section of the README). These are NON-secret identifiers, so they
# live here as config-as-code (unlike secrets, which are set with
# `wrangler pages secret put`). Fill in from your Access application:
#   ACCESS_TEAM_DOMAIN — your Zero Trust team domain (e.g. "yourteam.cloudflareaccess.com")
#   ACCESS_AUD         — the Access application's Audience (AUD) tag
# Until both are set correctly, admin deletes fail closed (HTTP 401).
[vars]
ACCESS_TEAM_DOMAIN = "curly-dawn-5d75.cloudflareaccess.com"
ACCESS_AUD = "91807e57cb3adca1a0a1e229178b0a26ee848f3fd01e64b380aa2dfc67ff72d4"
